# Mostrar las sentencias SQL generadas por Hibernate
spring.jpa.show-sql=true
# Mostrar el SQL con formato legible
spring.jpa.properties.hibernate.format_sql=true
# Crear las tablas al arrancar y eliminarlas al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
# Contar sentencias SQL para la demostración N+1
spring.jpa.properties.hibernate.generate_statistics=true
# Reducir mensajes innecesarios en la consola
spring.main.banner-mode=off
logging.level.root=warn
